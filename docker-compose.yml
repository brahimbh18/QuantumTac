services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumtac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumtac}
      POSTGRES_DB: ${POSTGRES_DB:-quantumtac}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumtac}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://quantumtac:quantumtac@db:5432/quantumtac?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: ${PORT:-8081}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
